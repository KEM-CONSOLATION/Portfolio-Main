<!doctype html>
<html>
  <head>
    <title>Generate Icons</title>
  </head>
  <body>
    <h1>Icon Generator</h1>
    <p>
      Open this file in a browser and use the canvas to generate icons, or use
      an online tool like:
    </p>
    <ul>
      <li>
        <a href="https://realfavicongenerator.net/" target="_blank"
          >RealFaviconGenerator</a
        >
      </li>
      <li>
        <a href="https://www.favicon-generator.org/" target="_blank"
          >Favicon Generator</a
        >
      </li>
    </ul>
    <canvas
      id="canvas"
      width="180"
      height="180"
      style="border: 1px solid #ccc"
    ></canvas>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      // Create gradient background
      const gradient = ctx.createLinearGradient(0, 0, 180, 180);
      gradient.addColorStop(0, "#3b82f6");
      gradient.addColorStop(1, "#10b981");

      // Draw rounded rectangle
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(0, 0, 180, 180, 40);
      ctx.fill();

      // Draw text
      ctx.fillStyle = "white";
      ctx.font = "bold 100px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("CK", 90, 90);

      // Download function
      function downloadIcon(size, filename) {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = size;
        tempCanvas.height = size;
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.drawImage(canvas, 0, 0, size, size);
        tempCanvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
        });
      }

      // Add download buttons
      const sizes = [
        { size: 16, name: "icon-16x16.png" },
        { size: 32, name: "icon-32x32.png" },
        { size: 180, name: "apple-touch-icon.png" },
      ];

      sizes.forEach(({ size, name }) => {
        const btn = document.createElement("button");
        btn.textContent = `Download ${name}`;
        btn.onclick = () => downloadIcon(size, name);
        document.body.appendChild(btn);
        document.body.appendChild(document.createElement("br"));
      });
    </script>
  </body>
</html>
